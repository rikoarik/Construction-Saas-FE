<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none" opacity="0.35">
  <defs>
    <pattern id="grid-pattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 4" />
      <circle cx="80" cy="80" r="1.5" fill="currentColor" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <!-- Architectural Datum Lines -->
  <line x1="80" y1="40" x2="1120" y2="40" stroke="currentColor" stroke-width="1" />
  <line x1="80" y1="560" x2="1120" y2="560" stroke="currentColor" stroke-width="1" />
  <line x1="80" y1="40" x2="80" y2="560" stroke="currentColor" stroke-width="1" />
  <line x1="1120" y1="40" x2="1120" y2="560" stroke="currentColor" stroke-width="1" />

  <!-- Elevation & Grid Axis Marks -->
  <g font-family="monospace" font-size="10" fill="currentColor" opacity="0.7">
    <text x="90" y="32">AXIS A-01 [STA 12+400]</text>
    <text x="400" y="32">AXIS B-04 [GRID TIE-BEAM]</text>
    <text x="800" y="32">AXIS C-08 [CORE SLAB FC-35]</text>
    <text x="1010" y="32">ELEV +48.200 m</text>

    <text x="90" y="580">DATUM 0.000 (BM-01)</text>
    <text x="600" y="580">STRUCTURAL TOLERANCE: ±2.5mm</text>
    <text x="1020" y="580">SPEC: UX-SYS-001</text>
  </g>

  <!-- Crosshair intersection markers -->
  <g stroke="currentColor" stroke-width="1" opacity="0.8">
    <path d="M 70 40 L 90 40 M 80 30 L 80 50" />
    <path d="M 390 40 L 410 40 M 400 30 L 400 50" />
    <path d="M 790 40 L 810 40 M 800 30 L 800 50" />
    <path d="M 1110 40 L 1130 40 M 1120 30 L 1120 50" />
    <path d="M 70 560 L 90 560 M 80 550 L 80 570" />
    <path d="M 1110 560 L 1130 560 M 1120 550 L 1120 570" />
  </g>
</svg>